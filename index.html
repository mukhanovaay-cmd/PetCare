<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Care — помощь животным</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: светлый, добрый, hopecore — надежда вместо жалости
   IDEA: остров-приют, куда стекаются сердца людей, и растущий друг в вашем профиле
   PICTURE: 3D-история в четырёх главах + живой питомец-тамагочи
   COLOUR and TYPE: небесно-голубой, teal, pink, yellow на светлом; Unbounded + Manrope
   LAYOUT: яркие полосы во всю ширину, карточки, липкая 3D-сцена, профиль-ящик справа */
:root{color-scheme:light dark;
--bg:light-dark(#FFFACD,#06302F);--ink:light-dark(#0B3D3B,#FFFACD);--soft:light-dark(#4A5755,#B4C3C1);
--card:light-dark(#FFFFFF,#0B3D3B);--line:light-dark(#FFDAB9,#24544A);
--sky:#E6E6FA;--sky-t:light-dark(#F0F0FC,#16283A);--teal:#0ABAB5;--teal-t:light-dark(#D4F4F2,#173230);--teal-d:light-dark(#077F7B,#7FD8D5);
--pink:#FFB6C1;--pink-t:light-dark(#FFE4E9,#36222A);--pink-d:light-dark(#A33A5C,#FFB6C1);
--yel:#FFDAB9;--yel-t:light-dark(#FFFACD,#34301E);--yel-d:light-dark(#6B4E08,#FFDAB9);
--btn:light-dark(#0B3D3B,#FFB6C1);--btn-ink:light-dark(#FFFACD,#0B3D3B)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Unbounded,Manrope,sans-serif;letter-spacing:-.01em;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:clamp(36px,5.6vw,64px);font-weight:800}h2{font-size:clamp(28px,3.8vw,44px)}h3{font-size:19px;line-height:1.25}
p{margin:0}a{color:var(--teal-d)}
.wrap{max-width:1240px;margin:0 auto}
.band{padding:clamp(44px,6vw,92px) max(5vw,16px)}
.lead{font-size:17px;color:var(--soft);max-width:62ch}
.pastel{color:#1E2A2B}.pastel .lead,.pastel .soft{color:#3E4E4C}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border-radius:18px;border:0;font:800 16px Manrope,sans-serif;cursor:pointer;text-decoration:none;background:var(--btn);color:var(--btn-ink);transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .3s}
.btn:hover{box-shadow:0 10px 24px rgb(30 42 43/.2);filter:brightness(1.06)}.btn:active{transform:scale(.96)}
.btn.ghost{background:rgb(255 255 255/.75);color:#1E2A2B;border:1.5px solid rgb(30 42 43/.12)}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px;border-radius:14px}
.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 11px;border-radius:10px;background:var(--pink-t);color:var(--pink-d)}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px}
.grid{display:grid;gap:18px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:30px}
.note{font-size:13px;color:var(--soft)}
/* nav */
nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:14px;padding:10px max(5vw,16px);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font:800 19px Unbounded,sans-serif;color:var(--ink);text-decoration:none;margin-right:auto}
.logo i{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--teal),var(--sky));display:grid;place-items:center}
.links{display:flex;gap:2px;flex-wrap:wrap}
.links a{color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;padding:10px 9px;border-radius:12px}
.links a:hover{background:var(--teal-t)}
.tools{display:flex;gap:8px;align-items:center}
.lang{display:flex;background:var(--line);border-radius:14px;padding:3px}
.lang button{min-width:42px;min-height:38px;border:0;border-radius:11px;background:none;color:var(--ink);font:800 13px Manrope,sans-serif;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--card);box-shadow:0 2px 8px rgb(0 0 0/.08)}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ibtn[aria-pressed=true]{background:var(--yel);border-color:var(--yel);color:#1E2A2B}
.me{display:flex;align-items:center;gap:8px;min-height:44px;padding:2px 12px 2px 4px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:800 14px Manrope,sans-serif}
.me .mini{width:38px;height:38px;border-radius:12px;background:var(--yel-t);display:grid;place-items:center;overflow:hidden}
.me .mini svg{width:40px;height:40px}
.me small{display:block;font-weight:600;font-size:11px;color:var(--soft);line-height:1}
@media(max-width:1000px){.links{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap}.links a{flex:none}}
@media(max-width:520px){.me b,.me small{display:none}.me{padding:2px 4px}}
/* hero */
.hero{background:linear-gradient(180deg,#E6E6FA 0%,#D4F4F2 55%,#FFE4E9 100%);position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center;position:relative}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.proof{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.proof span{display:flex;align-items:center;gap:8px;background:rgb(255 255 255/.72);border-radius:16px;padding:10px 14px;font-weight:700;font-size:14px}
.proof b{font:800 18px Unbounded,sans-serif}
.avatars{display:flex}.avatars i{width:28px;height:28px;border-radius:50%;border:2px solid #fff;margin-left:-8px;display:grid;place-items:center;font-style:normal;font-size:14px}
.avatars i:first-child{margin-left:0}
.scene{position:relative;aspect-ratio:1/0.92;width:100%}
.scene svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
@media(max-width:780px){.hero .wrap{grid-template-columns:1fr}.scene{max-width:460px;margin:0 auto}}
.fl{animation:fl 6s ease-in-out infinite}.fl2{animation:fl 4.6s ease-in-out -2s infinite}.fl3{animation:fl 7.4s ease-in-out -4s infinite}
@keyframes fl{50%{transform:translateY(-10px)}}
.spin-slow{animation:rot 40s linear infinite;transform-origin:430px 90px}@keyframes rot{to{transform:rotate(360deg)}}
/* 3d story */
.story{position:relative;height:420vh;background:linear-gradient(180deg,#FFE4E9 0%,#CFE9FB 30%,#E6E6FA 70%,#FFFACD 100%)}
.stage{position:sticky;top:0;height:100vh;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.chap{position:absolute;left:max(5vw,16px);bottom:clamp(24px,6vh,64px);width:min(460px,calc(100% - 32px));background:rgb(255 255 255/.86);backdrop-filter:blur(10px);color:#1E2A2B;border-radius:28px;padding:24px 26px;box-shadow:0 20px 50px rgb(30 42 43/.12);opacity:0;transform:translateY(30px) scale(.97);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1);pointer-events:none}
.chap.on{opacity:1;transform:none}
.chap .k{font:800 13px Manrope,sans-serif;color:#077F7B;margin-bottom:8px;display:block}
.chap h3{font-size:clamp(22px,2.6vw,30px);margin-bottom:10px}
.chap p{color:#3E4E4C}
.dots{position:absolute;right:max(5vw,16px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgb(30 42 43/.2);transition:background .4s,transform .4s}
.dots i.on{background:#1E2A2B;transform:scale(1.4)}
.story-title{position:absolute;top:clamp(80px,11vh,110px);left:0;right:0;text-align:center;color:#1E2A2B;padding:0 16px}
.story-title p{font-weight:700;color:#3E4E4C;margin-top:8px}
.no3d .stage{display:grid;place-items:center}
/* stats */
.stats{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat b{display:block;font:800 clamp(28px,3vw,38px) Unbounded,sans-serif;margin-bottom:8px;white-space:nowrap}
.stat p{font-size:14px;color:var(--soft)}
/* ways */
.ways{grid-template-columns:repeat(4,minmax(0,1fr))}
.way{border:0;border-radius:28px;padding:22px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;text-decoration:none;color:#1E2A2B;transition:transform .35s cubic-bezier(.3,1.6,.5,1),box-shadow .35s}
.way .ic{transition:transform .35s cubic-bezier(.16,1,.3,1)}.way:hover .ic{transform:translateY(-4px) rotate(-8deg)}.way:hover{box-shadow:0 14px 30px rgb(30 42 43/.14)}
.way .ic{width:52px;height:52px;border-radius:50%;background:rgb(255 255 255/.75);display:grid;place-items:center;font-size:26px}
.way p{font-size:14px;color:#33413F;margin-top:6px}
@media(max-width:900px){.ways{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.ways{grid-template-columns:1fr}}
/* pets */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 15px Manrope,sans-serif;cursor:pointer;transition:background .25s,color .25s}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pets{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.pet{position:relative;padding:0;overflow:hidden;transition:transform .35s cubic-bezier(.3,1.6,.5,1),box-shadow .35s}
.pet:hover{box-shadow:0 14px 30px rgb(30 42 43/.12)}
.pet .open{all:unset;display:block;width:100%;cursor:pointer}
.pet .pic{height:190px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.pet .pic svg{width:170px;height:170px;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.pet:hover .pic svg{transform:translateY(-8px) rotate(-3deg)}
.pet .meta{padding:14px 18px 18px;display:flex;flex-direction:column;gap:4px}
.pet .meta b{font-size:18px}.pet .meta span{font-size:14px;color:var(--soft)}
.demo{position:absolute;left:12px;top:12px;font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;background:rgb(255 255 255/.85);color:#4A5755}
.like{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgb(255 255 255/.9);display:grid;place-items:center;cursor:pointer}
.like.on svg{fill:#F27C94;stroke:#F27C94;animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.25)}}
/* funds */
.funds{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.funds{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.funds{grid-template-columns:1fr}}
.fund{display:flex;flex-direction:column;gap:12px}
.track{height:10px;border-radius:10px;background:light-dark(#F1EEE8,#2A3838);overflow:hidden}
.track i{display:block;height:100%;border-radius:10px;width:0;transition:width 1.4s cubic-bezier(.16,1,.3,1)}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--soft)}
.row b{color:var(--ink);white-space:nowrap}
.trust{display:flex;gap:14px;align-items:flex-start;background:var(--teal-t);border-radius:22px;padding:18px 20px;margin-bottom:18px}
/* shelters */
.shelters{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1000px){.shelters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.shelters{grid-template-columns:1fr}}
.sh{display:flex;flex-direction:column;gap:12px}
.sh .top{display:flex;gap:12px;align-items:center}
.sh .av{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font:800 18px Unbounded,sans-serif;color:#1E2A2B}
.sh dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:14px}
.sh dt{color:var(--soft)}.sh dd{margin:0;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{font-size:13px;font-weight:600;padding:5px 10px;border-radius:10px;border:1px solid var(--line)}
.links2{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
/* volunteer */
.vol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media(max-width:900px){.vol{grid-template-columns:1fr}}
.dirs{display:flex;flex-direction:column;gap:10px}
.dir{all:unset;box-sizing:border-box;display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;transition:border-color .3s,background .3s}
.dir[aria-pressed=true]{border-color:var(--teal);background:var(--teal-t)}
.dir .e{font-size:26px;line-height:1}
.dir p{font-size:14px;color:var(--soft);margin-top:4px}
form.vf{display:flex;flex-direction:column;gap:14px}
label{font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:6px}
input,select,textarea{font:16px Manrope,sans-serif;min-height:48px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
/* quiz */
.quiz{background:linear-gradient(135deg,#FFFACD,#FFE4E9)}
.qbox{max-width:780px}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:18px 0 22px}
.segs i{height:7px;border-radius:7px;background:#EDE3C2;transition:background .5s}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.opts button{text-align:left;padding:16px 18px;border-radius:18px;border:1.5px solid rgb(30 42 43/.1);background:#fff;color:#1E2A2B;font:600 16px/1.4 Manrope,sans-serif;cursor:pointer;transition:background .3s,border-color .3s,opacity .3s}
.fb{margin-top:16px;min-height:26px;color:#3E4E4C}
.meter{font:800 clamp(48px,7vw,76px) Unbounded,sans-serif}
/* law */
.law{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
@media(max-width:900px){.law{grid-template-columns:1fr}}
details{border-bottom:1px solid var(--line);padding:6px 0}
summary{cursor:pointer;font:700 17px Manrope,sans-serif;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::after{content:"+";font:700 22px Unbounded,sans-serif;color:var(--teal-d)}
details[open] summary::after{content:"−"}
details p{color:var(--soft);padding-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--soft)}td.n{text-align:right;font-weight:800;white-space:nowrap}
/* offline */
.off{background:linear-gradient(135deg,#FFE4E9,#F0F0FC)}
.off .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);gap:40px;align-items:center}
@media(max-width:780px){.off .wrap{grid-template-columns:1fr}}
.stand{background:#fff;color:#1E2A2B;border-radius:30px;padding:26px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;box-shadow:0 24px 48px rgb(30 42 43/.14);transform:rotate(-2deg)}
.qr{width:140px;height:140px;border-radius:16px;background:#fff;padding:8px;border:1px solid #ECE8E0}
footer{border-top:1px solid var(--line);font-size:14px;color:var(--soft)}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between}
/* dialogs */
dialog{border:0;padding:0;border-radius:30px;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--card);color:var(--ink);box-shadow:0 30px 80px rgb(0 0 0/.25)}
dialog::backdrop{background:rgb(18 26 27/.45);backdrop-filter:blur(3px)}
dialog[open]{animation:dlg .5s cubic-bezier(.16,1,.3,1)}
@keyframes dlg{from{opacity:0;transform:translateY(40px) scale(.97)}}
.dhead{height:230px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.dhead svg{width:210px;height:210px}
.dbody{padding:24px;display:flex;flex-direction:column;gap:16px}
.x{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:14px;border:0;background:rgb(255 255 255/.9);cursor:pointer;display:grid;place-items:center;z-index:2}
/* profile drawer */
#profile{margin:0 0 0 auto;height:100vh;max-height:100vh;border-radius:30px 0 0 30px;width:min(440px,100vw)}
#profile[open]{animation:drw .55s cubic-bezier(.16,1,.3,1)}
@keyframes drw{from{transform:translateX(100%)}}
.pf{padding:24px;display:flex;flex-direction:column;gap:18px}
.home{position:relative;height:260px;border-radius:26px;background:linear-gradient(180deg,#E6E6FA,#FFFACD);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.home svg.buddy{width:220px;height:220px;transition:transform .8s cubic-bezier(.3,1.6,.5,1)}
.home .grass{position:absolute;left:0;right:0;bottom:0;height:46px;background:#A8E6E3;border-radius:50% 50% 0 0/30px 30px 0 0}
.home .mood{position:absolute;left:14px;top:14px;background:rgb(255 255 255/.85);color:#1E2A2B;border-radius:14px;padding:8px 12px;font-size:13px;font-weight:700;max-width:70%}
.kind{position:absolute;right:12px;top:12px;display:flex;gap:4px;background:rgb(255 255 255/.85);border-radius:12px;padding:3px}
.kind button{min-width:40px;min-height:36px;border:0;border-radius:9px;background:none;cursor:pointer;font-size:18px}
.kind button[aria-pressed=true]{background:#fff;box-shadow:0 2px 6px rgb(0 0 0/.1)}
.lvl{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lvl b{font:800 26px Unbounded,sans-serif}
.xpbar{height:14px;border-radius:14px;background:light-dark(#F1EEE8,#2A3838);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:14px;background:linear-gradient(90deg,var(--teal),var(--sky),var(--pink));transition:width 1s cubic-bezier(.16,1,.3,1)}
.streak{display:flex;gap:6px}
.streak i{flex:1;height:44px;border-radius:12px;background:light-dark(#F1EEE8,#2A3838);display:grid;place-items:center;font-style:normal;font-size:18px}
.streak i.on{background:var(--yel)}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.badge{aspect-ratio:1;border-radius:20px;display:grid;place-items:center;font-size:28px;background:light-dark(#F1EEE8,#2A3838);filter:grayscale(1);opacity:.45;position:relative}
.badge.got{filter:none;opacity:1;background:var(--yel-t)}
.acts2{display:flex;flex-direction:column;gap:6px;font-size:14px}
.acts2 div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.acts2 b{color:var(--teal-d);white-space:nowrap}
/* level-up */
#lvlup{width:min(420px,calc(100vw - 24px));text-align:center;overflow:visible;background:transparent;box-shadow:none}
.lu{background:var(--card);border-radius:32px;padding:30px 24px 24px;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 30px 80px rgb(0 0 0/.3)}
.medal{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-size:64px;background:conic-gradient(from 0deg,#0ABAB5,#E6E6FA,#FFB6C1,#FFDAB9,#0ABAB5);box-shadow:0 0 0 10px #fff inset,0 16px 40px rgb(30 42 43/.2);animation:medal 1.3s cubic-bezier(.16,1,.3,1) both}
@keyframes medal{0%{transform:perspective(600px) rotateY(-540deg) scale(.2);opacity:0}70%{transform:perspective(600px) rotateY(20deg) scale(1.08);opacity:1}100%{transform:perspective(600px) rotateY(0) scale(1)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:100;width:100%;height:100%}
/* toast */

.rig .leg{transform-box:fill-box;transform-origin:50% 10%}
.rig .squash{transform-box:fill-box;transform-origin:50% 100%}
.rig .tail{transform-box:fill-box;transform-origin:100% 100%;transition:transform .5s}
.rig .head{transform-box:fill-box;transform-origin:35% 85%;transition:transform .5s}
.rig .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

.rig.sad .ear-f,.rig.sad .ear-b{transform:rotate(28deg)}

.rig.sad .tail{transform:rotate(-80deg)}

.rig.happy .tail{animation:wag .26s ease-in-out infinite alternate}@keyframes wag{from{transform:rotate(-16deg)}to{transform:rotate(24deg)}}
.rig.neutral .tail{animation:wag 1.1s ease-in-out infinite alternate}
